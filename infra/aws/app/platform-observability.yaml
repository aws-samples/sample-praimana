AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Praimana - the App-account observability tier: twelve alarms, the alerts topic
  and up to five email subscriptions, the liveness canary and the platform dashboard. A strict
  leaf - nothing else depends on it.

Parameters:
  KmsKeyArn:
    Type: String
    Description: >
      ARN of the customer-managed KMS key from platform-kms.yaml (tier 0). REQUIRED, no
      default. Enables a customer-managed KMS key for encryption at rest.

      ⚠ REQUIRED RATHER THAN OPTIONAL ON PURPOSE. An optional key would mean wrapping every
      encryption property in an Fn::If, and neither cfn_nag nor checkov can resolve an
      intrinsic - the findings this exists to clear would stay open, exactly as W73 did for
      the BillingMode parameter. A required parameter is the only shape that both encrypts
      and closes the finding.

      ⚠ Pass the full ARN, not a key id and not an alias: an alias can be repointed at a
      different key without this stack changing.
    AllowedPattern: "^arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-f0-9-]+$"
    ConstraintDescription: Must be a full KMS key ARN from the tier-0 KMS stack.

  Environment:
    Type: String
    Description: >
      Environment tag. REQUIRED, no default - a wrong environment tag silently corrupts cost
      allocation.
    AllowedValues: ["dev", "test", "staging", "prod", "shared"]

  AlertEmail:
    Type: String
    Default: ""
    AllowedPattern: '^$|^[^\s,]+@[^\s,]+(,[^\s,]+@[^\s,]+)*$'

    ConstraintDescription: >-
      must be empty, one email address, or several separated by commas with NO SPACES
      (e.g. ops@example.com,oncall@example.com)
    Description: >-
      Where CloudWatch alarms are DELIVERED. Every alarm in this stack used to have no
      AlarmActions at all, so all four evaluated, changed state, and told nobody —
      console artefacts rather than pages, useful only to someone who already thought
      to look. This is the parameter that closes that.

      A PARAMETER WITH NO DEFAULT, not a hardcoded address: an operator mailbox is
      deployment topology, it differs per environment, and a real human address does not
      belong in a tracked file. EMPTY means the topic is still created and all four
      alarms still publish to it — so wiring is deployed and verifiable — but nothing is
      subscribed, and therefore nothing is delivered. That is a deliberate middle state:
      it lets the plumbing be reviewed and the topic be subscribed later from the
      console without a stack update.

      ⚠ SUBSCRIBING IS NOT COMPLETE ON DEPLOY. SNS emails each address a confirmation
      link that a HUMAN must click; until then the subscription sits PendingConfirmation
      and delivers nothing. So a green stack update is NOT evidence that alarms reach
      anyone — check the subscription state, which is exactly what the deploy runbook
      says to verify. With several addresses, EACH ONE needs its own click.

      ── ⚠ ONE OR MORE ADDRESSES, COMMA-SEPARATED, NO SPACES ──

      "ops@example.com" or "ops@example.com,oncall@example.com,lead@example.com". Up to
      FIVE are subscribed (see AlertsEmailSubscription1..5).

      ⚠ THE NAME STAYED SINGULAR ON PURPOSE. Renaming it to AlertEmails would have been
      tidier and would have SILENTLY UNSUBSCRIBED the live recipient: `aws cloudformation
      deploy` sends UsePreviousValue only for parameters that still EXIST, so a renamed
      parameter takes its default — "" — and the existing subscription is deleted. A
      single address remains a valid one-element list, so widening in place costs nothing
      and risks nothing.

      ⚠ NO SPACES AFTER THE COMMAS. " oncall@example.com" is subscribed verbatim, leading
      space included, and then delivers to nobody while looking correct in the console.
      The AllowedPattern below refuses it at change-set time rather than letting it
      deploy — a validation that exists because the failure is invisible.

      ⚠ FIVE IS A CEILING IMPOSED BY CLOUDFORMATION, NOT A PRODUCT DECISION. There is no
      loop: each subscription must be its own declared resource. For a wider audience,
      subscribe a DISTRIBUTION LIST — one address here, membership managed where group
      membership belongs, and no stack update when the on-call rota changes.

      Unrelated to EmailFrom / EmailReplyTo, which are the NOTIFY service's SES
      transport for product email (invitations). This is operational alerting over SNS
      and shares nothing with them: no SES verification is needed for an SNS
      subscription.

  EnableCanary:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Create the liveness canary, its artifact bucket, its role and its alarm.

      DEFAULT true, because "is the platform up?" currently has no answer that does not involve
      asking a participant — and for a product used in time-boxed live workshops, where the whole
      audience is in one room for one day, a 20-minute unnoticed outage is a material fraction of
      the event. It is a parameter at all so a customer can decline the cost (see CanaryRate).

  CanaryRate:
    Type: String
    Default: "rate(5 minutes)"
    AllowedValues: ["rate(1 minute)", "rate(5 minutes)", "rate(15 minutes)"]
    Description: >-
      How often the liveness canary runs.

      ⚠ THIS IS THE COST DECISION. Canary runs are billed
      individually (100/month free, then ~$0.0012 per run at us-east-1 pricing when this was
      written), so:

        rate(1 minute)   ≈ 43,200 runs/month  ≈ $52/month   — detects in ~2 min
        rate(5 minutes)  ≈  8,640 runs/month  ≈ $10/month   — detects in ~10 min
        rate(15 minutes) ≈  2,880 runs/month  ≈  $3/month   — detects in ~30 min

      The alarm needs TWO consecutive failures (one is a blip, two is an outage), so detection time
      is roughly twice the rate. The figures above are the ones to plan with; check current
      CloudWatch Synthetics pricing for your Region.

      5 minutes is the default because it closes the gap for a tenth of the price. ⚠ TURN IT TO
      rate(1 minute) FOR AN EVENT DAY — that is one parameter on one stack update, and on the day
      itself a ten-minute blind spot is the expensive one.

  CanaryBaseUrl:
    Type: String
    Default: ""
    AllowedPattern: "^$|^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._~/-]*)?$"
    ConstraintDescription: >
      Must be empty, or an https:// URL with no trailing slash and no query string.
    Description: >-
      Base URL the canary probes, with no trailing slash. EMPTY means the API Gateway invoke URL for
      this stack's own HTTP API, which is always correct and needs no configuration.

      ⚠ SET IT TO THE CUSTOM DOMAIN IF ONE IS IN USE, because the invoke URL does not exercise the
      domain name, its ACM certificate or its API mapping — and a lapsed certificate takes the
      platform down for every real client while a canary on the invoke URL stays green. That is a
      known, deliberate blind spot of the default rather than an oversight.

  ApiId:
    Type: String
    Description: >
      ApiId output of platform-api.yaml. Used as the ApiId dimension on the edge alarms and in
      six dashboard widgets.
    AllowedPattern: "^[a-z0-9]{8,20}$"
    ConstraintDescription: Must be an API Gateway HTTP API id.

  CanaryArtifactsBucketName:
    Type: String
    Description: >
      CanaryArtifactsBucketName output of platform-plumbing.yaml. Where each canary run writes
      its HAR/log bundle. Interpolated into the canary role's S3 ARN, so the pattern is scoping.
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    ConstraintDescription: Must be a valid S3 bucket name.

  DeadLetterQueueName:
    Type: String
    Description: >
      Queue NAME (not ARN) from platform-plumbing.yaml - CloudWatch's SQS dimension takes the
      name. Used by DeadLetterQueueNotEmptyAlarm and one dashboard widget.
    AllowedPattern: "^[A-Za-z0-9_-]{1,80}$"
    ConstraintDescription: Must be an SQS queue name.

Conditions:
  CanaryEnabled: !Equals [!Ref EnableCanary, "true"]
  HasCanaryBaseUrl: !Not [!Equals [!Ref CanaryBaseUrl, ""]]
  HasAlertEmail:  !Not [!Equals [!Ref AlertEmail, ""]]
  HasAlertEmail2: !Not [!Equals [!Select [1, !Split [",", !Sub "${AlertEmail},,,,"]], ""]]
  HasAlertEmail3: !Not [!Equals [!Select [2, !Split [",", !Sub "${AlertEmail},,,,"]], ""]]
  HasAlertEmail4: !Not [!Equals [!Select [3, !Split [",", !Sub "${AlertEmail},,,,"]], ""]]
  HasAlertEmail5: !Not [!Equals [!Select [4, !Split [",", !Sub "${AlertEmail},,,,"]], ""]]

Resources:
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      KmsMasterKeyId: !Ref KmsKeyArn
      TopicName: praimana-alerts
      DisplayName: Praimana alerts

  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Select [0, !Split [",", !Sub "${AlertEmail},,,,"]]

  AlertsEmailSubscription2:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail2
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Select [1, !Split [",", !Sub "${AlertEmail},,,,"]]

  AlertsEmailSubscription3:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail3
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Select [2, !Split [",", !Sub "${AlertEmail},,,,"]]

  AlertsEmailSubscription4:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail4
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Select [3, !Split [",", !Sub "${AlertEmail},,,,"]]

  AlertsEmailSubscription5:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail5
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Select [4, !Split [",", !Sub "${AlertEmail},,,,"]]

  KeyLifecycleAlarmRule:
    Type: AWS::Events::Rule
    Properties:
      Name: praimana-kms-key-lifecycle
      Description: >-
        Pages when anyone schedules deletion of, disables, or re-policies the platform KMS key.
        ScheduleKeyDeletion is the one that destroys data irrecoverably when its window expires.
      State: ENABLED
      EventPattern:
        source:
          - aws.kms
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventSource:
            - kms.amazonaws.com
          eventName:
            - ScheduleKeyDeletion
            - DisableKey
            - PutKeyPolicy
            - DisableKeyRotation
            - CancelKeyDeletion
      Targets:
        - Id: AlertsTopic
          Arn: !Ref AlertsTopic

  AlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AlertsTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertsTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref "AWS::AccountId"
          - Sid: AllowCloudWatchAlarmsPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlertsTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref "AWS::AccountId"
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:praimana-*"

  ApiServerErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >-
              Explicit resource name is a cross-stack contract, and removing it makes
              CloudFormation REPLACE the resource. For the DynamoDB tables that DESTROYS
              PRODUCTION DATA, so the explicit name is retained deliberately. Changing it is
              out of scope precisely because it forces a destructive replacement.
    Properties:
      AlarmName: praimana-api-5xx
      AlarmDescription: >-
        The edge API is returning server errors. Baseline is 1 in 21,973 requests over 7 days, so 5
        in five minutes is abnormal rather than noise. This is the GATEWAY's view, so it catches an
        integration failure or a crashed function that a service log would not. RUNBOOK: (1) Query
        /praimana/api-access in Insights, filter status>=500, group by routeKey — that names
        the route and carries integrationErrorMessage. (2) Read the matching
        /praimana/<service> group around the same requestId. (3) If the routes span several
        services, suspect a shared dependency (DynamoDB, Cognito) rather than a service. (4) A 5xx
        storm with FLAT Lambda Errors means the failure is in the gateway or integration, not the code.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref ApiId
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  ApiLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >-
              Explicit resource name is a cross-stack contract, and removing it makes
              CloudFormation REPLACE the resource. For the DynamoDB tables that DESTROYS
              PRODUCTION DATA, so the explicit name is retained deliberately. Changing it is
              out of scope precisely because it forces a destructive replacement.
    Properties:
      AlarmName: praimana-api-latency-p99
      AlarmDescription: >-
        The edge API's p99 latency is above 5 seconds for 15 minutes. p99 rather than an average,
        because an average hides the tail a participant actually experiences. 5s is the stated p99.9
        budget and sits below the 15s function timeout with room for a cold east-west hop (measured
        1802ms). RUNBOOK: (1) The dashboard's per-service Duration widget shows WHICH service. (2)
        If one is slow and the others are not, read its group for the east-west timeout message — a
        callee brownout surfaces as latency in the CALLER. (3) If ALL are slow, suspect DynamoDB or a
        cold-start storm after a deploy. (4) Sustained latency near 15s produces hard cuts
        mid-request, which look like data loss rather than slowness.
      Namespace: AWS/ApiGateway
      MetricName: Latency
      Dimensions:
        - Name: ApiId
          Value: !Ref ApiId
      ExtendedStatistic: p99
      Period: 300
      EvaluationPeriods: 3
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  LambdaThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >-
              Explicit resource name is a cross-stack contract, and removing it makes
              CloudFormation REPLACE the resource. For the DynamoDB tables that DESTROYS
              PRODUCTION DATA, so the explicit name is retained deliberately. Changing it is
              out of scope precisely because it forces a destructive replacement.
    Properties:
      AlarmName: praimana-lambda-throttled
      AlarmDescription: >-
        A Lambda invocation was THROTTLED — the platform hit its concurrency ceiling and requests
        were rejected before running. ⚠ THIS IS THE ONE ALARM WHOSE THRESHOLD IS 1: a throttle is
        never normal here, because the gateway is capped at 200 rps precisely so
        concurrency cannot be exhausted. It means the cap was raised, a function is holding
        connections far longer than expected, or ANOTHER WORKLOAD IN THIS ACCOUNT is consuming the
        shared 1,000 concurrency. RUNBOOK: (1) The dashboard's Throttles widget names the function.
        (2) Compare ConcurrentExecutions with the account limit. (3) Look for a NON-PLATFORM function
        in this account first — the limit is account-wide, so a neighbour can starve this platform.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >-
              Explicit resource name is a cross-stack contract, and removing it makes
              CloudFormation REPLACE the resource. For the DynamoDB tables that DESTROYS
              PRODUCTION DATA, so the explicit name is retained deliberately. Changing it is
              out of scope precisely because it forces a destructive replacement.
    Properties:
      AlarmName: praimana-lambda-errors
      AlarmDescription: >-
        Lambda invocations are FAILING across the platform — an unhandled throw, an out-of-memory or
        a timeout. Account-wide so one alarm covers all fifteen; the dashboard names which. Baseline
        over 7 days is ZERO, so 5 in five minutes is a real regression. ⚠ IT CANNOT SEE A FAIL-CLOSED
        REFUSAL: TEAM_SCOPE_UNAVAILABLE and friends are SUCCESSFUL invocations returning a 503 body,
        so this stays FLAT through a dependency outage that refuses every user — see
        a per-service error alarm. RUNBOOK: (1) Dashboard Errors widget for the
        function. (2) Its /praimana/<service> group, filter ERROR. (3) If it began at a deploy,
        the release version is on the function configuration.
      Namespace: AWS/Lambda
      MetricName: Errors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  CanaryRole:
    Type: AWS::IAM::Role
    Condition: CanaryEnabled
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: >-
              Irreducible: the AWS APIs for these actions take NO resource ARN and IAM rejects
              anything but '*' (dynamodb:ListStreams, cloudwatch:DescribeAlarms, Cost Explorer
              reads, s3:ListAllMyBuckets, cloudwatch:PutMetricData). Verified by experiment, not
              assumption - iam simulate said an ARN-scoped resource would work and the live call
              returned AccessDenied regardless. Each is already narrowed by a query filter or an
              IAM condition wherever the API permits.
          - id: W28
            reason: >-
              Explicit resource name is a cross-stack contract, and removing it makes
              CloudFormation REPLACE the resource. For the DynamoDB tables that DESTROYS
              PRODUCTION DATA, so the explicit name is retained deliberately. Changing it is
              out of scope precisely because it forces a destructive replacement.
    Properties:
      RoleName: !Sub "praimana-canary-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: canary-run
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:GetBucketLocation]
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${CanaryArtifactsBucketName}/*"
                  - !Sub "arn:${AWS::Partition}:s3:::${CanaryArtifactsBucketName}"
              - Effect: Allow
                Action: s3:ListAllMyBuckets
                Resource: "*"
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cwsyn-*"
              - Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals: { "cloudwatch:namespace": CloudWatchSynthetics }
      Tags:
        - { Key: ApplicationName, Value: Praimana }

  HealthCanary:
    Type: AWS::Synthetics::Canary
    Condition: CanaryEnabled
    Properties:
      Name: praimana-live
      RuntimeVersion: syn-nodejs-5.2
      ExecutionRoleArn: !GetAtt CanaryRole.Arn
      ArtifactS3Location: !Sub "s3://${CanaryArtifactsBucketName}"
      StartCanaryAfterCreation: true
      DeleteLambdaResourcesOnCanaryDeletion: true
      Schedule:
        Expression: !Ref CanaryRate
      RunConfig:
        TimeoutInSeconds: 45
        MemoryInMB: 960
        ActiveTracing: false
        EnvironmentVariables:
          CANARY_BASE_URL: !If
            - HasCanaryBaseUrl
            - !Ref CanaryBaseUrl
            - !Sub "https://${ApiId}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
      Code:
        Handler: index.handler
        Script: |
            const https = require("node:https");

            /**
             * WHAT EACH CHECK PROVES. This is the whole value of the canary, so it is written down
             * next to the code rather than in a wiki nobody opens at 9am on event day.
             *
             *  1. GET /v1/auth/config  -> 200 AND a Cognito issuer in the body.
             *     Proves the edge, the JWT authorizer's bypass path, the identity Lambda and its
             *     configuration. Asserting the ISSUER rather than only the status is the point: if
             *     COGNITO_ISSUER were ever lost the route still answers 200 with "", and every
             *     front-end would be unable to start a sign-in while a status-only check stayed green.
             *
             *  2. GET /v1/invitations/lookup-by-token?token=<sentinel>  -> 404.
             *     Proves the TEAM service and a REAL DynamoDB READ: the route hashes the token and
             *     Queries the tokenHash-index, so a 404 means the store answered. This is the only
             *     check that reaches past a Lambda into a table, and it does so with no credentials
             *     and no side effect.
             *     A 200 would mean the sentinel matched a real invitation and is treated as a
             *     FAILURE — that would be a token collision, which is worth waking somebody for.
             *
             *  3. GET /v1/auth/me with NO Authorization header  -> 401.
             *     Proves the authorizer is still REFUSING. This is a security invariant, not a
             *     liveness one: if it ever returns 200 or 500 the gateway has broken OPEN and every
             *     participant's profile is exposed. Nothing else on this platform would notice, and
             *     it costs one request to check.
             */
            // Supplied by RunConfig.EnvironmentVariables, never interpolated into this file.
            const BASE = process.env.CANARY_BASE_URL;
            if (!BASE) throw new Error("CANARY_BASE_URL is not set - the canary cannot probe anything");

            /** A token that cannot be a real invite. Hashed before lookup, so nothing is injectable. */
            const SENTINEL = "canary-liveness-probe-not-a-real-invite-token";

            function get(path, headers) {
              return new Promise((resolve, reject) => {
                const url = new URL(BASE + path);
                const req = https.request(
                  {
                    hostname: url.hostname,
                    path: url.pathname + url.search,
                    method: "GET",
                    // Below the 45s run timeout so a hung dependency fails THIS check with a clear
                    // message instead of killing the whole run with an opaque one.
                    timeout: 10000,
                    headers: { "user-agent": "praimana-liveness-canary", ...headers },
                  },
                  (res) => {
                    let body = "";
                    // Bounded: a probe must not be the thing that runs out of memory.
                    res.on("data", (chunk) => {
                      if (body.length < 8192) body += chunk;
                    });
                    res.on("end", () => resolve({ status: res.statusCode, body }));
                  }
                );
                req.on("timeout", () => req.destroy(new Error("timed out after 10s")));
                req.on("error", reject);
                req.end();
              });
            }

            /**
             * ⚠ HOW MANY CHECKS RAN IS ITSELF ASSERTED. The authorizer check below is a security
             * tripwire, and SuccessPercent cannot tell "the assertion passed" from "the assertion
             * is no longer there" - both are 100. So every check increments this, and the handler
             * fails if the count is not what it should be. Deleting or short-circuiting a check
             * now turns the canary RED instead of leaving its alarm green over nothing.
             *
             * Deliberately a counter rather than a PutMetricData call per check: the template
             * already commits to the runtime-independent "throw to fail, return to succeed"
             * contract, and requiring an SDK import would make the canary itself breakable by a
             * runtime upgrade.
             */
            const EXPECTED_CHECKS = 3;
            let ran = 0;

            /** Every failure message names the CHECK, the EXPECTATION and the URL. */
            async function check(name, path, expected, headers, assertBody) {
              let res;
              try {
                res = await get(path, headers);
              } catch (err) {
                throw new Error(`${name}: no response from ${BASE}${path} — ${err.message}`);
              }
              if (res.status !== expected) {
                throw new Error(
                  `${name}: expected ${expected} from ${path}, got ${res.status}`
                );
              }
              if (assertBody) assertBody(res.body);
              ran += 1;
              console.log(`${name}: ok (${res.status})`);
            }

            exports.handler = async () => {
              // ⚠ RESET PER INVOCATION, AND THE ABSENCE OF THIS LINE FAILED EVERY WARM RUN.
              // `ran` is declared at module scope so `check()` can close over it, and Lambda
              // reuses a warm execution environment across invocations - so it accumulated
              // instead of resetting: 3 on the cold start (pass), then 6, 9, 12 (fail), with
              // the guard reporting "only 12 of 3 checks ran". That reads as a canary that
              // lost a check, i.e. an outage, when in fact the platform was answering all
              // three every time. Observed live: three consecutive FAILED runs at 6, 9 and 12
              // while /v1/workshops was correctly returning 401.
              ran = 0;

              await check("edge+identity", "/v1/auth/config", 200, {}, (body) => {
                let parsed;
                try {
                  parsed = JSON.parse(body);
                } catch {
                  throw new Error("edge+identity: /v1/auth/config did not return JSON");
                }
                if (!String(parsed.issuer || "").startsWith("https://cognito-idp.")) {
                  throw new Error(
                    "edge+identity: config answered 200 with no Cognito issuer — sign-in is broken"
                  );
                }
              });

              await check(
                "team+dynamodb",
                `/v1/invitations/lookup-by-token?token=${encodeURIComponent(SENTINEL)}`,
                404
              );

              // ⚠ 401 IS THE PASS CONDITION HERE. Anything else means the authorizer is not refusing.
              await check("authorizer-refuses", "/v1/auth/me", 401);

              if (ran !== EXPECTED_CHECKS) {
                throw new Error(
                  `only ${ran} of ${EXPECTED_CHECKS} checks ran - a check was removed or skipped, ` +
                    "so this canary is no longer proving what its alarm claims"
                );
              }

              return `platform is answering (${ran}/${EXPECTED_CHECKS} checks): edge, identity, team, dynamodb, authorizer`;
            };
      Tags:
        - { Key: ApplicationName, Value: Praimana }
        - { Key: Environment, Value: !Ref Environment }
        - { Key: auto-delete, Value: never }

  CanaryFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CanaryEnabled
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >-
              Explicit resource name is a cross-stack contract, and removing it makes
              CloudFormation REPLACE the resource. For the DynamoDB tables that DESTROYS
              PRODUCTION DATA, so the explicit name is retained deliberately. Changing it is
              out of scope precisely because it forces a destructive replacement.
    Properties:
      AlarmName: praimana-canary-failed
      AlarmDescription: >-
        THE PLATFORM IS NOT ANSWERING FROM OUTSIDE. Two consecutive canary runs failed. ⚠ THIS IS THE
        ONLY ALARM THAT WOULD FIRE IF THE PLATFORM STOPPED RESPONDING ALTOGETHER — every other alarm
        watches a symptom the platform reports about ITSELF, so a dead platform reports nothing and
        they all stay OK. RUNBOOK: (1) The canary's run log names which of the three checks failed and
        what it expected. (2) "edge+identity" — the gateway or the identity function; check API 5xx and
        that route's integration. (3) "team+dynamodb" — the team function or the invitations table; a
        503 here means a coded refusal, so check FailClosedRefusals too. (4) "authorizer-refuses" is a
        SECURITY failure, not an availability one: the gateway returned something other than 401 to an
        unauthenticated request, so treat every route as exposed until proven otherwise. (5) Nothing
        failing but the alarm red means the canary itself broke — check its role and the artifact
        bucket before assuming an outage.
      Namespace: CloudWatchSynthetics
      MetricName: SuccessPercent
      Dimensions:
        - Name: CanaryName
          Value: !Ref HealthCanary
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 100
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

