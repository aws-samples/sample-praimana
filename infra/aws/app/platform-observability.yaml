  FailClosedRefusalAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >-
              Explicit resource name is a cross-stack contract, and removing it makes
              CloudFormation REPLACE the resource. For the DynamoDB tables that DESTROYS
              PRODUCTION DATA, so the explicit name is retained deliberately. Changing it is
              out of scope precisely because it forces a destructive replacement.
    Properties:
      AlarmName: praimana-fail-closed-refusals
      AlarmDescription: >-
        Services are REFUSING requests because a dependency did not answer —
        TEAM_SCOPE_UNAVAILABLE, ENTITLEMENTS_UNAVAILABLE and the rest. THIS IS THE OUTAGE NO OTHER
        ALARM SEES: those are SUCCESSFUL invocations returning a 503 body, so Lambda Errors stays
        FLAT while every user is refused (measured: 0 errors over 7 days). THE THRESHOLD IS
        PROVISIONAL — nothing measured this before, so there is no baseline; retune after a week of
        real data. RUNBOOK: (1) Split the metric by Code (why) and Service (who refused — the CALLER,
        not necessarily the broken thing). (2) TEAM_SCOPE_* or ENTITLEMENTS_* means the Team service
        is not answering; check its errors and duration. (3) SNAPSHOT_SOURCE_* means docs or
        workshop. (4) UNCODED means a 503 with no code in the body — find it via the routePath
        property. (5) THE REFUSAL IS CORRECT BEHAVIOUR; the bug is always the thing that
        stopped answering.
      Namespace: Praimana/FailClosed
      MetricName: FailClosedRefusals
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  BedrockRefusalAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >-
              Explicit resource name is a cross-stack contract, and removing it makes
              CloudFormation REPLACE the resource. For the DynamoDB tables that DESTROYS
              PRODUCTION DATA, so the explicit name is retained deliberately. Changing it is
              out of scope precisely because it forces a destructive replacement.
    Properties:
      AlarmName: praimana-bedrock-refused
      AlarmDescription: >-
        INSIGHTS GENERATION CANNOT REACH A MODEL. AWS/Bedrock does not show entitlement-layer
        refusals, so this custom metric does. SPLIT BY `Reason`: (1) USE_CASE_NOT_SUBMITTED - a human
        must submit the Anthropic use-case form; no deploy fixes it. (2) SUBSCRIPTION_INCOMPLETE - the
        model is listed but not subscribed. (3) CONFIG_MISSING - BEDROCK_RATINGS_MODEL_ID or the
        BEDROCK_GUARDRAIL_ID/VERSION pair is unset on the ai function. (4) MODEL_END_OF_LIFE /
        MODEL_NOT_FOUND - repoint RatingsModelId. (5) ACCESS_DENIED - the ai function's IAM. (6)
        RESPONSE_INVALID - the model answered unusably. (7) THROTTLED / SERVER_ERROR / TIMEOUT -
        transient. (8) GUARDRAIL_INTERVENED - the Amazon Bedrock guardrail blocked a team's input or
        the reply; a sustained rate means review that transcript or the filter strengths. The route
        answers 503 (502 for an unusable reply) and keeps the previous snapshot.
      Namespace: Praimana/Bedrock
      MetricName: BedrockRefusals
      Statistic: Sum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]
      OKActions: [!Ref AlertsTopic]

  CognitoGroupAssignmentFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >-
              Explicit resource name is a cross-stack contract, and removing it makes
              CloudFormation REPLACE the resource. For the DynamoDB tables that DESTROYS
              PRODUCTION DATA, so the explicit name is retained deliberately. Changing it is
              out of scope precisely because it forces a destructive replacement.
    Properties:
      AlarmName: praimana-cognito-group-assignment-failed
      AlarmDescription: >-
        The Cognito post-confirmation trigger failed to add a confirmed user to
        their role group. The user IS signed up but has no cognito:groups claim, so
        they are treated as PARTICIPANT regardless of their invited role. Check the
        praimana-cognito-postconfirmation logs for "add-to-group failed"; the
        known cause is the AdminAddUserToGroup call being unable to reach
        cognito-idp (a VPC endpoint is incompatible with a pool that has a domain).
      Namespace: Praimana/CognitoPostConfirmation
      MetricName: GroupAssignmentFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  SeatLedgerDriftAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >-
              Explicit resource name is a cross-stack contract, and removing it makes
              CloudFormation REPLACE the resource. For the DynamoDB tables that DESTROYS
              PRODUCTION DATA, so the explicit name is retained deliberately. Changing it is
              out of scope precisely because it forces a destructive replacement.
    Properties:
      AlarmName: praimana-seat-ledger-drift
      AlarmDescription: >-
        A team's memberCount no longer matches its ACTIVE roster. The count moves in the same
        transaction as the membership row, so this CANNOT happen through the Team service —
        it means a writer bypassed the membership repository. Consequence: joins are refused
        to a team that has room (or allowed past its cap). RUNBOOK: (1) Find the team via the
        log line "SEAT LEDGER DRIFT" — it carries teamId, actualActive and ledgerCount. (2)
        THIS IS A CODE DEFECT, NOT A NUMBER TO RECONCILE. Grep for writes to team-members
        outside repository.dynamo.ts admit/deactivate/reactivate; a new route or a script is
        the usual cause. (3) Only after the writer is found, correct the row with a single
        conditional UpdateItem — re-running the backfill will NOT fix it, its
        attribute_not_exists guard skips rows that already have a count. (4) A separate log
        line "no memberCount" means the OPPOSITE problem: an unledgered row, fixed by
        scripts/backfill-team-seat-ledger.mjs, and it reports drift 0 by design.
      Namespace: Praimana/TeamSeats
      MetricName: SeatLedgerDrift
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  UnauditedAccessChangeAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >-
              Explicit resource name is a cross-stack contract, and removing it makes
              CloudFormation REPLACE the resource. For the DynamoDB tables that DESTROYS
              PRODUCTION DATA, so the explicit name is retained deliberately. Changing it is
              out of scope precisely because it forces a destructive replacement.
    Properties:
      AlarmName: praimana-unaudited-access-change
      AlarmDescription: >-
        An access change TOOK EFFECT but was NOT written to the audit trail: no record of
        who made it. The change is real and the request answered 200 by design — this is a
        lost audit fact, not a failed operation. RUNBOOK: (1) CHECK praimana-audit
        FIRST — separate table, own capacity, so its WriteThrottleEvents /
        ThrottledRequests / SystemErrors is the likely cause. (2) Find what was lost via the
        Action dimension and the log line "access change UNRECORDED" (ids only). (3) THE
        ACTOR IS RECOVERABLE FROM THE ROW for every action, written with the change and
        BEFORE the audit call: MEMBER_* -> praimana-team-members
        removedBy/reactivatedBy; ACCESS_* -> praimana-users accessChangedBy;
        ENTITLEMENT_REVOKED -> praimana-invitations workshopRevokedBy. Only the MOST
        RECENT actor is kept, so act before a later change overwrites it and CloudTrail is
        all that is left. (4) The trail is append-only, so any reconstructed entry is a NEW
        one and cannot be back-dated.
      Namespace: Praimana/AccessChanges
      MetricName: UnauditedAccessChanges
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  UserProjectionStreamLagAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >-
              Explicit resource name is a cross-stack contract, and removing it makes
              CloudFormation REPLACE the resource. For the DynamoDB tables that DESTROYS
              PRODUCTION DATA, so the explicit name is retained deliberately. Changing it is
              out of scope precisely because it forces a destructive replacement.
    Properties:
      AlarmName: praimana-user-projection-stream-lag
      AlarmDescription: >-
        The users read-model projection is falling behind the praimana-users
        DynamoDB Stream: member names, chat and commit authors, shared-thread bylines and
        contribution rows are serving STALE data and will not self-correct while this is
        breaching. RUNBOOK: (1) check the praimana-user-projection logs for
        "read-model write failed" — a throttled or missing read-model table is the likely
        cause, and the table name is in the log line; (2) check
        praimana-dlq for records that exhausted MaximumRetryAttempts; (3) if the
        shard is stalled on a poison record, the DLQ entry names its sequence number.
        Do NOT raise ParallelizationFactor to catch up — the projection is
        last-write-wins and depends on single-threaded per-shard ordering; concurrent
        invocations would write the wrong name permanently. Once the cause is fixed, run
        scripts/backfill-user-readmodels.mjs to converge anything that aged out of the
        stream's 24h retention.
      Namespace: AWS/Lambda
      MetricName: IteratorAge
      Dimensions:
        - Name: FunctionName
          Value: praimana-user-projection
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 60000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

  DeadLetterQueueNotEmptyAlarm:
    Type: AWS::CloudWatch::Alarm
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >-
              Explicit resource name is a cross-stack contract, and removing it makes
              CloudFormation REPLACE the resource. For the DynamoDB tables that DESTROYS
              PRODUCTION DATA, so the explicit name is retained deliberately. Changing it is
              out of scope precisely because it forces a destructive replacement.
    Properties:
      AlarmName: praimana-dlq-not-empty
      AlarmDescription: >-
        A message reached praimana-dlq, meaning some event exhausted its retries and
        is now dropped unless someone acts. RUNBOOK: (1) receive (do not delete) the
        messages to identify the source — the user-projection stream mapping sends record
        METADATA including the shard and sequence number, the EventBridge rule sends the
        original event; (2) for a projection failure, fix the underlying read-model write
        (see the praimana-user-projection-stream-lag runbook) and then run
        scripts/backfill-user-readmodels.mjs, which is idempotent and reconverges every
        user regardless of which record was lost; (3) purge only after the data is
        confirmed converged, because purging is the point at which the loss becomes
        permanent and unattributable.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: praimana-dlq
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic
      OKActions:
        - !Ref AlertsTopic

Outputs:
  AlertsTopicArn:
    Description: >
      Subscribe a chat channel or ticket queue here if email is the wrong destination. The topic
      exists even when AlertEmail is empty, so this is always valid.
    Value: !Ref AlertsTopic

  DashboardName:
    Description: The platform dashboard. Three rows - is it up, is it healthy, is it fast.
    Value: !Ref PlatformDashboard

  CanaryName:
    Condition: CanaryEnabled
    Description: Liveness canary. Probes from outside, so it notices what in-stack metrics cannot.
    Value: !Ref HealthCanary
