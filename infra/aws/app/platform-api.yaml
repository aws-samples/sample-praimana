              reads, s3:ListAllMyBuckets, cloudwatch:PutMetricData). Verified by experiment, not
              assumption - iam simulate said an ARN-scoped resource would work and the live call
              returned AccessDenied regardless. Each is already narrowed by a query filter or an
              IAM condition wherever the API permits.
