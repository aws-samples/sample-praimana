    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !GetAtt RatingsGuardrail.GuardrailId
      Description: >-
        Guardrail configuration 1. CloudFormation only publishes a new version when this resource
        changes, so bump the number in this description whenever RatingsGuardrail is edited.

