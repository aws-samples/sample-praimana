  EvaluationActivityRule:
    Type: AWS::Events::Rule
    Properties:
      Name: praimana-evaluation-activity
      EventBusName: praimana-events
      Description: Feed member-activity counters in the evaluation read-model.
      EventPattern:
        detail-type:
          - task.created
          - task.status-changed
