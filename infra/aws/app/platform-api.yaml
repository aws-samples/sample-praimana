      LogGroupName: /praimana/api-access
      RetentionInDays: !If [LogsNeverExpire, !Ref "AWS::NoValue", !Ref LogRetentionInDays]

  HttpApi:
    Type: AWS::Serverless::HttpApi
    DependsOn: ApiAccessLogGroup
    Properties:
      StageName: $default
      Description: Praimana edge API — JWT-authorized, routes to per-service Lambdas.
      DefaultRouteSettings:
        ThrottlingRateLimit: 200
        ThrottlingBurstLimit: 400
        DetailedMetricsEnabled: true
      RouteSettings:
        "POST /v1/ai/teams/{teamId}/ratings/analyze":
          ThrottlingRateLimit: 1
          ThrottlingBurstLimit: 5
          DetailedMetricsEnabled: true
      AccessLogSettings:
        DestinationArn: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/praimana/api-access"
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","sub":"$context.authorizer.claims.sub","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","path":"$context.path","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","responseLatency":"$context.responseLatency","integrationStatus":"$context.integrationStatus","integrationLatency":"$context.integrationLatency","integrationErrorMessage":"$context.integrationErrorMessage","authorizerError":"$context.authorizer.error"}'
      CorsConfiguration:
        AllowOrigins: !Ref ApiAllowedOrigins
        AllowHeaders: ["authorization", "content-type"]
        AllowMethods: ["GET", "POST", "PATCH", "PUT", "DELETE", "OPTIONS"]
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: "$request.header.Authorization"
            JwtConfiguration:
              issuer: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}"
              audience:
                - !Ref UserPoolClientId

