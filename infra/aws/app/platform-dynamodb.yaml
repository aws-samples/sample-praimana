AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Praimana - the App-account data layer: 35 DynamoDB tables with their
  indexes. Creates no IAM, no compute and no network. Table names are fixed literals,
  so only one copy of this stack can be deployed per account and region.

Parameters:
  KmsKeyArn:
    Type: String
    Description: >
      ARN of the customer-managed KMS key from platform-kms.yaml (tier 0). REQUIRED, no
      default. Encrypts all 35 tables via SSESpecification below.

      ⚠ REQUIRED RATHER THAN OPTIONAL ON PURPOSE. An optional key would mean wrapping every
      SSESpecification in an Fn::If, and neither cfn_nag nor checkov can resolve an intrinsic -
      the 70 findings this change exists to clear would stay open, exactly as W73 did for
      BillingMode. See the note above Resources. A required parameter is the only shape that
      both encrypts the data and closes the finding.

      ⚠ THIS MAKES THE KMS TIER A HARD PREREQUISITE. platform-dynamodb.yaml was tier 1 and is
      now tier 2; nothing in this stack can deploy until the key exists.
    AllowedPattern: "^arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-f0-9-]+$"
    ConstraintDescription: >
      Must be a full KMS key ARN, not a key id and not an alias. DynamoDB's KMSMasterKeyId
      accepts an alias, but an alias can be repointed at a different key without this stack
      changing, which would silently split the fleet's data across two keys.

  Environment:
    Type: String
    Description: >
      Environment tag applied to every table. REQUIRED, no default - a wrong environment
      tag is worse than a failed deploy, because it silently corrupts cost allocation and
      can mislead an automated cleanup process. Matches the vocabulary the CI/CD pipeline
      enforces on its own stacks.
    AllowedValues: ["dev", "test", "staging", "prod", "shared"]

Resources:
  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >-
              Explicit resource name is a cross-stack contract, and removing it makes
              CloudFormation REPLACE the resource. For the DynamoDB tables that DESTROYS
              PRODUCTION DATA, so the explicit name is retained deliberately. Changing it is
              out of scope precisely because it forces a destructive replacement.
    Properties:
      TableName: praimana-users
      BillingMode: PAY_PER_REQUEST
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !Ref KmsKeyArn
      AttributeDefinitions:
        - { AttributeName: id, AttributeType: S }
        - { AttributeName: email, AttributeType: S }
      KeySchema:
        - { AttributeName: id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - { AttributeName: email, KeyType: HASH }
          Projection: { ProjectionType: ALL }
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Tags:
        - { Key: Environment, Value: !Ref Environment }
        - { Key: ApplicationName, Value: Praimana }
        - { Key: auto-delete, Value: "never" }

