  RatingsGuardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: praimana-ratings
      Description: >-
        Applied to every ai-service Converse call. Screens transcript-derived input for prompt
        attacks and harmful content, and replies for harmful content, profanity and PII.
      BlockedInputMessaging: This request was blocked by the platform's content guardrail.
      BlockedOutputsMessaging: The response was blocked by the platform's content guardrail.
      ContentPolicyConfig:
        FiltersConfig:
          - { Type: SEXUAL, InputStrength: HIGH, OutputStrength: HIGH }
          - { Type: VIOLENCE, InputStrength: HIGH, OutputStrength: HIGH }
          - { Type: HATE, InputStrength: HIGH, OutputStrength: HIGH }
          - { Type: INSULTS, InputStrength: HIGH, OutputStrength: HIGH }
          - { Type: MISCONDUCT, InputStrength: HIGH, OutputStrength: HIGH }
          - { Type: PROMPT_ATTACK, InputStrength: HIGH, OutputStrength: NONE }
      WordPolicyConfig:
        ManagedWordListsConfig:
          - Type: PROFANITY
      SensitiveInformationPolicyConfig:
        PiiEntitiesConfig:
          - { Type: EMAIL, Action: ANONYMIZE }
          - { Type: PHONE, Action: ANONYMIZE }
          - { Type: AWS_ACCESS_KEY, Action: ANONYMIZE }
          - { Type: AWS_SECRET_KEY, Action: ANONYMIZE }
          - { Type: PASSWORD, Action: ANONYMIZE }
          - { Type: CREDIT_DEBIT_CARD_NUMBER, Action: ANONYMIZE }
      Tags:
        - { Key: ApplicationName, Value: Praimana }
        - { Key: Environment, Value: !Ref Environment }

