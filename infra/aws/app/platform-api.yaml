          - commit.pushed
          - ai.thread-shared
          - ai.response-generated
      State: ENABLED
      Targets:
        - Id: EvaluationFunction
          Arn: !GetAtt EvaluationFunction.Arn
          DeadLetterConfig:
            Arn: !Ref DeadLetterQueueArn

  EvaluationRuleInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref EvaluationFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EvaluationActivityRule.Arn

  UserProjectionRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: >-
              Irreducible: the AWS APIs for these actions take NO resource ARN and IAM rejects
              anything but '*' (dynamodb:ListStreams, cloudwatch:DescribeAlarms, Cost Explorer
              reads, s3:ListAllMyBuckets, cloudwatch:PutMetricData). Verified by experiment, not
              assumption - iam simulate said an ARN-scoped resource would work and the live call
              returned AccessDenied regardless. Each is already narrowed by a query filter or an
              IAM condition wherever the API permits.
          - id: W28
            reason: >-
              Explicit resource name is a cross-stack contract, and removing it makes
              CloudFormation REPLACE the resource. For the DynamoDB tables that DESTROYS
              PRODUCTION DATA, so the explicit name is retained deliberately. Changing it is
              out of scope precisely because it forces a destructive replacement.
    Properties:
      RoleName: praimana-user-projection
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref KmsUsePolicy
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: UserProjectionWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-team-users-readmodel"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-collaboration-users-readmodel"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-source-users-readmodel"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-ai-users-readmodel"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-evaluation-users-readmodel"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-docs-users-readmodel"
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-users/stream/*"
              - Effect: Allow
                Action: dynamodb:ListStreams
                Resource: "*"
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !Ref DeadLetterQueueArn

  UserProjectionFunction:
    Type: AWS::Serverless::Function
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W89
            reason: >-
              Lambda-in-VPC declined: placing these functions in a VPC breaks reachability of
              Cognito Managed Login through PrivateLink, and adds cold-start latency to every
              request, so it is accepted here as an out-of-scope change.
      checkov:
        skip:
          - id: CKV_AWS_116
            comment: >-
              DLQ exists at the TRIGGER layer, which is the correct and more granular place:
              EventBridge Rule DeadLetterConfig and EventSourceMapping
              DestinationConfig.OnFailure, both targeting the shared DLQ with bounded retry. 13
              of these 15 functions are invoked SYNCHRONOUSLY, where this function-level
              property is inert. Both async consumers verified idempotent.
          - id: CKV_AWS_117
            comment: >-
              Lambda-in-VPC declined: it breaks reachability of Cognito Managed Login through
              PrivateLink and adds cold-start latency, so it is not adopted.
    Properties:
      KmsKeyArn: !Ref KmsKeyArn
      FunctionName: praimana-user-projection
      Description: >-
        Fans every change to praimana-users, via its DynamoDB Stream, out into all
        five services' users read-models so member lists, chat and commit authors,
        shared-thread bylines and contribution rows render a name.
      CodeUri:
        Bucket: !Ref ServicesBucket
        Key: !Sub "lambda/v${ReleaseVersion}/user-projection/user-projection.zip"
      Handler: handler.handler
      Role: !GetAtt UserProjectionRole.Arn
      LoggingConfig:
        LogGroup: !Ref UserProjectionLogGroup
      ReservedConcurrentExecutions: 2
      Environment:
        Variables:
          TABLE_TEAM_USERS_READMODEL: praimana-team-users-readmodel
          TABLE_COLLABORATION_USERS_READMODEL: praimana-collaboration-users-readmodel
          TABLE_SOURCE_USERS_READMODEL: praimana-source-users-readmodel
          TABLE_AI_USERS_READMODEL: praimana-ai-users-readmodel
          TABLE_EVALUATION_USERS_READMODEL: praimana-evaluation-users-readmodel
          TABLE_DOCS_USERS_READMODEL: praimana-docs-users-readmodel

  UserProjectionStream:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !Ref UsersTableStreamArn
      FunctionName: !Ref UserProjectionFunction
      StartingPosition: TRIM_HORIZON
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 1
      ParallelizationFactor: 1
      MaximumRetryAttempts: 3
      MaximumRecordAgeInSeconds: 3600
      BisectBatchOnFunctionError: true
      FunctionResponseTypes:
        - ReportBatchItemFailures
      DestinationConfig:
        OnFailure:
          Destination: !Ref DeadLetterQueueArn

