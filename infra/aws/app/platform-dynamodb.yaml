Outputs:
  UsersTableName:
    Description: Name of the users table.
    Value: !Ref UsersTable

  UsersTableStreamArn:
    Description: >
      DynamoDB stream ARN for the users table - the only stream in the data layer, and the
      one value a compute stack genuinely needs from here (its EventSourceMapping consumes
      it to drive the user-projection read models).
    Value: !GetAtt UsersTable.StreamArn

  TableCount:
    Description: How many tables this stack manages, so a drift check has something to compare.
    Value: "35"
