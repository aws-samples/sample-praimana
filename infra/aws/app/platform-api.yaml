AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: >
  Praimana - the App-account API tier: thirteen service Lambdas, the HTTP API
  and its JWT authorizer, two EventBridge rules, the users-stream event source mapping, and the
  optional custom-domain mapping. The portal and the alarms/dashboard/canary are each a separate
  tier. Takes five values from the tiers below as parameters, not imports.

Globals:
  Function:
    Runtime: nodejs24.x
    Architectures: [arm64]
    MemorySize: 256
    Timeout: 15
    Tracing: Active
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps
        ENVIRONMENT: !Ref Environment
        EVENT_BUS_NAME: praimana-events
        EAST_WEST_TIMEOUT_MS: !Ref EastWestTimeoutMs
    Tags:
      ApplicationName: Praimana
      Environment: !Ref Environment

Parameters:
  KmsKeyArn:
    Type: String
    Description: >
      ARN of the customer-managed KMS key from platform-kms.yaml (tier 0). REQUIRED, no
      default. Enables a customer-managed KMS key for encryption at rest.

      ⚠ REQUIRED RATHER THAN OPTIONAL ON PURPOSE. An optional key would mean wrapping every
      encryption property in an Fn::If, and neither cfn_nag nor checkov can resolve an
      intrinsic - the findings this exists to clear would stay open, exactly as W73 did for
      the BillingMode parameter. A required parameter is the only shape that both encrypts
      and closes the finding.

      ⚠ Pass the full ARN, not a key id and not an alias: an alias can be repointed at a
      different key without this stack changing.
    AllowedPattern: "^arn:aws[a-zA-Z-]*:kms:[a-z0-9-]+:[0-9]{12}:key/[a-f0-9-]+$"
    ConstraintDescription: Must be a full KMS key ARN from the tier-0 KMS stack.

  AcmCertificateArn:
    Type: String
    Default: ""
    Description: >
      ARN of a pre-validated ACM certificate (REGIONAL, same region as this stack)
      covering DomainName. Left empty disables the custom domain regardless of
      EnableCustomDomain.

  ApiAllowedOrigins:
    Type: CommaDelimitedList
    Description: >-
      Web origins permitted to make cross-origin calls to the API, as a comma-separated list.
      REQUIRED - no default, so the origin list is always an explicit deployment decision.

      SET IT to your portal origin (and the desktop client's loopback, if it makes
      browser-style requests). A value of "*" means any page on the internet can call every
      /v1/* route with a stolen bearer and read the reply, including /v1/admin/* and
      /v1/user-access/*.

      AllowCredentials is deliberately not set, so cookies are never sent cross-origin and this
      is not a CSRF vector - a bearer token is still required either way.
    AllowedPattern: "^\\*$|^https?://[A-Za-z0-9.-]+(:[0-9]+)?$"
    ConstraintDescription: >
      Each entry must be a scheme://host[:port] origin with no path or trailing slash (http://
      only sensibly for localhost), or the single value "*" to opt in to any origin.

  CognitoDomainPrefix:
    Type: String
    Description: >
      REQUIRED. Prefix for the Cognito Hosted UI domain (<prefix>.auth.<region>.amazoncognito.com),
      the same value as platform-identity.yaml. Globally unique; no account-id fallback.
    AllowedPattern: "^[a-z0-9][a-z0-9-]{0,62}$"
    ConstraintDescription: Required. Lowercase alphanumerics and dashes.

  DesktopBucket:
    Type: String
    Description: >
      REQUIRED. Your installer bucket (praimana-artifacts<BucketNameSuffix> from
      infra/aws/shared/platform-buckets.yaml), holding desktop/{macos,windows}/. No default: the
      shared stack always appends a suffix, so an unsuffixed default never names a real bucket.
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    ConstraintDescription: Must be a valid S3 bucket name.

  DesktopBucketOwnerAccountId:
    Type: String
    Default: ""
    Description: >
      12-digit AWS account ID that owns DesktopBucket (the account where
      infra/aws/shared/platform-buckets.yaml is deployed). Becomes DESKTOP_BUCKET_OWNER, sent as
      ExpectedBucketOwner on every installer request and presigned download, so S3 refuses them if
      another account owns a bucket by that name. Leave empty when the bucket is in this account.
    AllowedPattern: "^(\\d{12})?$"
    ConstraintDescription: Must be a 12-digit AWS account ID, or empty for this account.

  DomainName:
    Type: String
    Default: api.ai.example.test
    Description: >
      Custom subdomain for the HTTP API. The admin front-end lives on the parent
      ai.example.test (CloudFront); the API is split onto the api.* child
      so the two don't collide.

  EastWestTimeoutMs:
    Type: Number
    Default: 2500
    MinValue: 200
    MaxValue: 10000
    Description: >-
      Per-attempt deadline, in milliseconds, for a service-to-service HTTP call
      (the authorization probes between team/workshop/collaboration/evaluation/
      source/ai). Applied to every function via Globals.

      LOWERING THIS BELOW ~1800 REINTRODUCED THAT BUG while the services ran in a VPC,
      where the PrivateLink first call cost ~1.8s. The functions now run outside a VPC, so a
      lower value is legitimate if you measure your own first-call cost. The service code warns on a value at or below the
      measured cost rather than refusing it, for exactly that case.

      MaxValue is 10000 because the point of the timeout is that a hung dependency
      cannot hold a Lambda: functions time out at 15s and the gateway at 29s, so a
      larger value would restore the unbounded wait while looking configured. The
      service code independently clamps to the same 200..10000 range and falls back
      to its compiled default if this is malformed — a stack parameter and a bundled
      constant can disagree, so neither is trusted alone.

  EmailFrom:
    Type: String
    Default: ""
    Description: >-
      Sender address for notify email; must be AT the verified domain (e.g.
      no-reply@<verified-domain>). EMPTY (the default) makes notify fall back to its
      console transport — it logs the email instead of sending. That is the safe
      default: an invite is recorded and re-sendable rather than silently failing.
      Setting this is what actually turns sending on (see notify/src/app.ts).

  EmailReplyTo:
    Type: String
    Default: ""
    Description: >-
      Reply-To address for notify email (comma-separate for several). Needs NO SES
      verification of its own — only EmailFrom must be a verified identity — so this
      can be a real human mailbox on any domain. EMPTY means replies to a no-reply@
      sender are DISCARDED with no bounce to the sender and no signal to us, so set
      it whenever recipients are people who might answer.

  EnableBulkProvision:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >-
      Create the bulk team-provisioning worker: its role, function,
      EventBridge rule and invoke permission.

      DEFAULT false, and the reason is an ordering constraint rather than caution: the
      function's CodeUri is lambda/v<ReleaseVersion>/bulk-provision/bulk-provision.zip, so
      enabling it against a release published BEFORE that package existed fails the stack
      update on an object that is not there. Publish a release containing it, then set this.

      ⚠ NO SHARED SECRET IS INVOLVED. An earlier draft added an InternalServiceToken for
      edgeIdentityMiddleware's path 3. It was unnecessary: the worker invokes team,
      user-access and notify DIRECTLY, so it constructs the invocation event itself and can
      populate requestContext.authorizer.jwt.claims — which path 1 reads WITHOUT verifying,
      because the gateway normally does that. lambda:InvokeFunction IS the credential.
      Adding the secret would have bought nothing and would have enabled path 3 permanently
      on three services for anyone who ever obtained the string.

  EnableCustomDomain:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Front the HTTP API with the custom domain (requires AcmCertificateArn).

  Environment:
    Type: String
    Default: ""
    Description: >-
      Optional environment name (e.g. dev, staging, prod). Used only as a tag /
      STAGE env value. It is NOT put in the API URL — the HTTP API always uses the
      "$default" stage so paths have no /dev prefix (Hono routes on rawPath). Leave
      empty to omit the environment tag entirely.

  InternalBaseUrl:
    Type: String
    Default: ""
    AllowedPattern: "^$|^https://[A-Za-z0-9.-]+(:[0-9]+)?/v1$"
    ConstraintDescription: >
      Must be empty (first deploy), or an https:// URL ending in /v1 - no http://, no trailing
      slash, no query string. It is handed live user bearer tokens.
    Description: >
      Base URL (…/v1) services use for east-west calls. Leave empty on the FIRST
      deploy (avoids a circular dependency on the HTTP API this stack creates), then
      redeploy with InternalBaseUrl=<ApiUrl>/v1.

  LogRetentionInDays:
    Type: String
    Default: "30"
    AllowedValues:
      ["0", "1", "3", "5", "7", "14", "30", "60", "90", "120", "150", "180", "365", "400",
       "545", "731", "1096", "1827", "2192", "2557", "2922", "3288", "3653"]
    Description: >-
      How many days CloudWatch keeps this platform's Lambda logs. Applied to every log group
      this template creates.

      "0" means NEVER EXPIRE — the behaviour every account had before this parameter existed.
      It is an allowed value on purpose (some retention policies require indefinite retention),
      but it is not the default, because unbounded growth should be a choice somebody made
      rather than one nobody noticed.

      30 days is the default because these are OPERATIONAL logs read during an incident, and an
      incident is investigated in hours or days. The compliance record is the audit TABLE, not
      these groups.

  PortalUrl:
    Type: String
    Default: ""
    Description: >-
      Origin of the PORTAL web app (e.g. https://ai.example.test), with no trailing
      slash. Used by the bulk-provisioning worker to build the /join/<token> links in invitation
      emails.

      ⚠ THIS IS NOT `DomainName`. That parameter is the API's domain
      (api.ai.example.test), and the first version of this worker DERIVED APP_URL from
      it — which produced invite links pointing at the API, where /join does not exist. Every
      recipient would have got a dead link, and because each invitation token is SINGLE-USE the only
      recovery is revoking and re-inviting everybody. The two domains are genuinely different things
      and must not be inferred from one another.

      EMPTY IS SAFE: the worker refuses to send anything when APP_URL is unset, so a forgotten value
      fails loudly BEFORE any team or account is created rather than mailing dead links.

  RatingsModelId:
    Type: String
    Default: "us.amazon.nova-2-lite-v1:0"
    Description: >-
      Model, inference-profile id, or application-inference-profile ARN for TEAM AI RATINGS.
      The adapter uses Bedrock's Converse API, so Nova and Anthropic are interchangeable
      here with no code change.
      ⚠ THE `us.` PREFIX IS LOAD-BEARING, NOT COSMETIC. It names the US geo cross-region
      inference profile. AWS's Nova 1-to-2 migration guide states Nova 2 Lite is available
      "through Global CRIS, US CRIS, EU CRIS, and JP CRIS endpoints" and instructs: "when
      accessing models from a US region, use the us. prefix". A bare `amazon.nova-2-lite-v1:0`
      is the MODEL identifier (what a foundation-model ARN contains); passing it as a modelId
      risks "ValidationException: Invocation of model ID ... with on-demand throughput isn't
      supported. Retry your request with the ID or ARN of an inference profile". `us.` is
      correct whether or not in-region on-demand also happens to work, so it is the safe
      default. From us-east-1 it routes to us-east-1, us-east-2 and us-west-2.
      Outside the US use `eu.` / `jp.`, or `global.` to route worldwide (no data-residency
      guarantee). NOTHING DERIVES THIS FROM AWS::Region - a deploy outside the US must set
      it explicitly.
      ⚠ NOT AN ACCOUNT-SPECIFIC ARN, deliberately. An application inference profile
      (arn:aws:bedrock:<account>:application-inference-profile/<id>) wrapping this same
      model would also work, but such an ARN embeds an account id and is wrong in every other
      account, which is a poor default for a template whose whole purpose is deploying into a
      fresh one. A system-defined profile id resolves in any account where the model is enabled.
      The IAM grant on AIServiceRole already covers both forms: `inference-profile/*` in
      this account for the profile itself, and `foundation-model/amazon.nova-*` with a
      WILDCARD REGION for the models the profile fans out to on the second hop.
      ⚠ NOVA RATHER THAN ANTHROPIC avoids the Anthropic use-case gate: an account that has not
      submitted the Anthropic use-case form gets "Model use case details have not been submitted
      for this account" from every Anthropic model, so a human must submit that form in the
      Bedrock console before an Anthropic id works here. Nova needs no such form.
      ⚠ THE MODEL MUST BE ENABLED IN THE TARGET ACCOUNT AND REGION. Bedrock model access is
      per-account: listed is not the same as enabled. Ratings answer 503
      RATINGS_UNAVAILABLE rather than failing silently if it is not.
      ⚠ RE-RUN the summary probe when changing this: obedience to the "never single out an
      individual" rule is behavioural, not a swap, and the summary is the only ratings output
      a judge can read.

  ReleaseVersion:
    Type: String
    Default: "1.0.0"
    AllowedPattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    ConstraintDescription: must look like 0.0.1 (<major>.<minor>.<patch>), with no leading "v"
    Description: >-
      The release whose artifacts this stack deploys. This is the services repo's
      package.json version VERBATIM, and it is the same string platform-portal.yaml takes as
      PortalReleaseVersion - one release, one number, whichever tier you are deploying.

  ServicesBucket:
    Type: String
    Description: >
      REQUIRED. Your Lambda zip bucket (praimana-services<BucketNameSuffix> from
      infra/aws/shared/platform-buckets.yaml). No default, for the same reason as DesktopBucket.
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    ConstraintDescription: Must be a valid S3 bucket name.

  SesIdentityArn:
    Type: String
    Default: ""
    Description: >-
      ARN of a verified identity in ANOTHER account, to send on its behalf
      (arn:aws:ses:<region>:<ses-account>:identity/<verified-domain>). EMPTY is the
      normal setting and the current one: the sender domain is verified in THIS
      account, so sends are same-account and need no delegation. Delegate sending
      needs BOTH sides — setting this adds the ARN to the notify role's ses:SendEmail
      grant, AND the owning account must attach an authorization policy to the
      identity naming that role as principal. The role's send grant itself is gated
      on EmailFrom, not on this parameter, so leaving it empty does NOT remove
      permission to send. For the owning account's side, see "Using sending authorization
      with Amazon SES" in the Amazon SES Developer Guide
      (https://docs.aws.amazon.com/ses/latest/dg/sending-authorization.html).

  UserPoolId:
    Type: String
    Description: >
      UserPoolId output of platform-identity.yaml. Interpolated into the JWT authorizer's
      issuer and into the user-pool ARN that several roles are scoped to.
    AllowedPattern: "^[a-z]{2}-[a-z]+-[0-9]{1}_[A-Za-z0-9]+$"
    ConstraintDescription: Must look like us-east-1_ABC123def.

  UserPoolClientId:
    Type: String
    Description: >
      UserPoolClientId output of platform-identity.yaml - the JWT audience. Stable across a
      callback-URL revision, which is what makes the portal two-pass safe.
    AllowedPattern: "^[a-z0-9]{16,64}$"
    ConstraintDescription: Must be a Cognito app client id.

  DeadLetterQueueArn:
    Type: String
    Description: >
      DeadLetterQueueArn output of platform-plumbing.yaml. Target of the two rules' and the
      projection's failure paths.
    AllowedPattern: "^arn:aws[a-z-]*:sqs:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_-]+$"
    ConstraintDescription: Must be an SQS queue ARN.

  DocsBucketName:
    Type: String
    Description: >
      DocsBucketName output of platform-plumbing.yaml. ⚠ THE PATTERN IS THE SCOPING: this is
      interpolated into an S3 ARN that grants object access, so a wildcard here would widen
      that grant. Same value class as every bucket-name parameter in these repos.
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    ConstraintDescription: Must be a valid S3 bucket name.

  ResourcesBucketName:
    Type: String
    Description: >
      ResourcesBucketName output of platform-plumbing.yaml — workshop-wide material uploaded by the
      facilitator. Becomes RESOURCES_BUCKET on the Workshop function. ⚠ THE PATTERN IS THE SCOPING, for
      the same reason DocsBucketName states: this is interpolated into an S3 ARN that grants object
      access, so a wildcard here would widen that grant.

      ⚠ EMPTY IS PERMITTED AND MEANS "NO RESOURCE STORAGE". The Workshop service then answers 501 on
      every resource route rather than opening an upload against bucket "" and failing inside the SDK.
      That keeps a tier that has not yet been redeployed working exactly as before, instead of
      presenting a Resources tab that silently drops files.
    Default: ""
    AllowedPattern: "^$|^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    ConstraintDescription: Must be empty, or a valid S3 bucket name.

  UsersTableStreamArn:
    Type: String
    Description: >
      UsersTableStreamArn output of platform-dynamodb.yaml. Consumed by the event source
      mapping that drives the user-projection read models. The only table value this tier
      needs - the other 33 are reached by hardcoded name.
    AllowedPattern: "^arn:aws[a-z-]*:dynamodb:[a-z0-9-]+:[0-9]{12}:table/[A-Za-z0-9_.-]+/stream/.+$"
    ConstraintDescription: Must be a DynamoDB stream ARN.

Conditions:
  BulkProvisionEnabled: !Equals [!Ref EnableBulkProvision, "true"]
  HasResourcesBucket: !Not [!Equals [!Ref ResourcesBucketName, ""]]
  HasDesktopBucketOwner: !Not [!Equals [!Ref DesktopBucketOwnerAccountId, ""]]
  DomainEnabled: !And
    - !Equals [!Ref EnableCustomDomain, "true"]
    - !Not [!Equals [!Ref AcmCertificateArn, ""]]
  HasEmailFrom: !Not [!Equals [!Ref EmailFrom, ""]]
  HasSesIdentityArn: !Not [!Equals [!Ref SesIdentityArn, ""]]
  LogsNeverExpire: !Equals [!Ref LogRetentionInDays, "0"]
Resources:
  KmsUsePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Data-plane use of the platform CMK. No administrative actions.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: UsePlatformKey
            Effect: Allow
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:ReEncrypt*
              - kms:GenerateDataKey*
              - kms:DescribeKey
            Resource: !Ref KmsKeyArn

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >-
              Explicit resource name is a cross-stack contract, and removing it makes
              CloudFormation REPLACE the resource. For the DynamoDB tables that DESTROYS
              PRODUCTION DATA, so the explicit name is retained deliberately. Changing it is
              out of scope precisely because it forces a destructive replacement.
    Properties:
      RoleName: praimana-lambda-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Ref KmsUsePolicy
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:TransactWriteItems
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-workshops"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-workshops/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-phases"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-phases/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-team-phases"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-team-phases/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-formats"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-formats/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-tasks"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-tasks/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-messages"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-messages/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-collaboration-users-readmodel"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-collaboration-users-readmodel/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-submissions-v2"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-submissions-v2/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-scores"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-scores/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-member-ratings-v2"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-member-ratings-v2/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-workshop-results"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-workshop-results/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-evaluation-users-readmodel"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-evaluation-users-readmodel/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-evaluation-activity-readmodel"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-evaluation-activity-readmodel/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-git-commits"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-git-commits/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-git-files"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-git-files/index/*"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-source-users-readmodel"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-source-users-readmodel/index/*"
              - Effect: Deny
                Action:
                  - dynamodb:DeleteItem
                  - dynamodb:UpdateItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:TransactWriteItems
                Resource:
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-audit"
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/praimana-audit/index/*"
        - PolicyName: EventBridgePublish
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: !Sub "arn:aws:events:${AWS::Region}:${AWS::AccountId}:event-bus/praimana-events"

        - PolicyName: WorkshopServiceInvoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:praimana-workshop"

        - PolicyName: NotifyServiceInvoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:praimana-notify"

        - !If
          - HasResourcesBucket
          - PolicyName: WorkshopResourcesAccess
            PolicyDocument:
              Version: "2012-10-17"
              Statement:

                - Effect: Allow
                  Action:
                    - s3:PutObject
                    - s3:GetObject
                    - s3:DeleteObject
                    - s3:AbortMultipartUpload
                    - s3:ListMultipartUploadParts
                  Resource: !Sub "arn:${AWS::Partition}:s3:::${ResourcesBucketName}/*"

                - Effect: Allow
                  Action:
                    - s3:ListBucket
                    - s3:ListBucketMultipartUploads
                  Resource: !Sub "arn:${AWS::Partition}:s3:::${ResourcesBucketName}"
          - !Ref AWS::NoValue

  TeamServiceRole:
    Type: AWS::IAM::Role
    Metadata:

      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: >-
              Explicit resource name is a cross-stack contract, and removing it makes
              CloudFormation REPLACE the resource. For the DynamoDB tables that DESTROYS
              PRODUCTION DATA, so the explicit name is retained deliberately. Changing it is
              out of scope precisely because it forces a destructive replacement.
    Properties:
