el":"notify"}],["AWS/Lambda","Duration","FunctionName","praimana-user-access",{"stat":"p99","label":"user-access"}],["AWS/Lambda","Duration","FunctionName","praimana-user-projection",{"stat":"p99","label":"user-projection"}],["AWS/Lambda","Duration","FunctionName","praimana-bulk-provision",{"stat":"p99","label":"bulk-provision"}],["AWS/Lambda","Duration","FunctionName","praimana-cognito-presignup",{"stat":"p99","label":"cognito-presignup"}],["AWS/Lambda","Duration","FunctionName","praimana-cognito-postconfirmation",{"stat":"p99","label":"cognito-postconfirmation"}]],"annotations":{"horizontal":[{"label":"timeout 15s","value":15000},{"label":"p99.9 budget 5s","value":5000}]}}},{"type":"metric","x":12,"y":29,"width":6,"height":6,"properties":{"title":"Invocations by service","region":"us-east-1","period":300,"metrics":[["AWS/Lambda","Invocations","FunctionName","praimana-ai",{"stat":"Sum","label":"ai"}],["AWS/Lambda","Invocations","FunctionName","praimana-team",{"stat":"Sum","label":"team"}],["AWS/Lambda","Invocations","FunctionName","praimana-evaluation",{"stat":"Sum","label":"evaluation"}],["AWS/Lambda","Invocations","FunctionName","praimana-collaboration",{"stat":"Sum","label":"collaboration"}],["AWS/Lambda","Invocations","FunctionName","praimana-workshop",{"stat":"Sum","label":"workshop"}],["AWS/Lambda","Invocations","FunctionName","praimana-docs",{"stat":"Sum","label":"docs"}],["AWS/Lambda","Invocations","FunctionName","praimana-identity",{"stat":"Sum","label":"identity"}],["AWS/Lambda","Invocations","FunctionName","praimana-source",{"stat":"Sum","label":"source"}],["AWS/Lambda","Invocations","FunctionName","praimana-desktop",{"stat":"Sum","label":"desktop"}],["AWS/Lambda","Invocations","FunctionName","praimana-notify",{"stat":"Sum","label":"notify"}],["AWS/Lambda","Invocations","FunctionName","praimana-user-access",{"stat":"Sum","label":"user-access"}],["AWS/Lambda","Invocations","FunctionName","praimana-user-projection",{"stat":"Sum","label":"user-projection"}],["AWS/Lambda","Invocations","FunctionName","praimana-bulk-provision",{"stat":"Sum","label":"bulk-provision"}],["AWS/Lambda","Invocations","FunctionName","praimana-cognito-presignup",{"stat":"Sum","label":"cognito-presignup"}],["AWS/Lambda","Invocations","FunctionName","praimana-cognito-postconfirmation",{"stat":"Sum","label":"cognito-postconfirmation"}]]}},{"type":"metric","x":18,"y":29,"width":6,"height":6,"properties":{"title":"Log bytes ingested","region":"us-east-1","stat":"Sum","period":86400,"metrics":[["AWS/Logs","IncomingBytes",{"label":"all groups"}]]}},{"type":"log","x":0,"y":35,"width":24,"height":6,"properties":{"title":"Refusals by EXPERIENCE — which workshop is affected right now","region":"us-east-1","query":"SOURCE '/praimana/ai' | SOURCE '/praimana/collaboration' | SOURCE '/praimana/desktop' | SOURCE '/praimana/docs' | SOURCE '/praimana/evaluation' | SOURCE '/praimana/identity' | SOURCE '/praimana/source' | SOURCE '/praimana/team' | SOURCE '/praimana/user-access' | SOURCE '/praimana/workshop' | filter ispresent(FailClosedRefusals) and ispresent(workshopId) | stats sum(FailClosedRefusals) as refusals by workshopId, Code, Service | sort refusals desc | limit 20","view":"table"}}]}
