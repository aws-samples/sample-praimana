      KmsKeyArn: !Ref KmsKeyArn
      FunctionName: praimana-user-access
      Description: User Access service. The ONE holder of Cognito admin writes — provisions an invited address's account (AdminCreateUser + group + profile row + user.created) under /v1/user-access/*. Runs OUTSIDE the VPC because cognito-idp is unreachable from it.
      CodeUri:
        Bucket: !Ref ServicesBucket
        Key: !Sub "lambda/v${ReleaseVersion}/user-access/user-access.zip"
      Handler: handler.handler
      Role: !GetAtt UserAccessRole.Arn
      LoggingConfig:
        LogGroup: !Ref UserAccessLogGroup
      Environment:
        Variables:
          COGNITO_USER_POOL_ID: !Ref UserPoolId
          TABLE_USERS: praimana-users
          TABLE_INVITATIONS: praimana-invitations
          TABLE_AUDIT: praimana-audit
          COGNITO_ISSUER: !Sub "https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPoolId}"
          COGNITO_AUDIENCE: !Ref UserPoolClientId
      Events:
        UserAccessRoutes:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: "/v1/user-access/{proxy+}"
            Method: ANY

  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: DomainEnabled
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref AcmCertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: DomainEnabled
    # ⚠ The $default STAGE is generated by the SAM transform (logical id
    # <ApiLogicalId>ApiGatewayDefaultStage), and nothing else orders this mapping after it. Without
    # this DependsOn the mapping races the stage and fails with "Invalid stage identifier
    # specified" - seen on the first deploy with EnableCustomDomain=true.
    DependsOn: HttpApiApiGatewayDefaultStage
    Properties:
      ApiId: !Ref HttpApi
      DomainName: !Ref ApiDomainName
      Stage: $default

Outputs:
  ApiEndpoint:
    Description: >
      The HTTP API's invoke URL. ⚠ THIS IS THE SECOND-PASS VALUE: re-deploy this stack with
      InternalBaseUrl set to this plus /v1 so the services can make east-west calls. It is a
      parameter rather than a reference precisely because a function reading it off HttpApi
      would create a cycle.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"

  ApiId:
    Description: >
      HTTP API id. The observability tier takes this as a parameter for its alarm dimensions -
      the only thing it needs from here.
    Value: !Ref HttpApi

  InternalBaseUrlForSecondPass:
    Description: Paste verbatim into InternalBaseUrl and re-deploy. Must be https and end in /v1.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/v1"
